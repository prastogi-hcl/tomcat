- name: Upgrade Apache Tomcat
  hosts: server
  become: yes
  gather_facts: yes  # needed because you use ansible_date_time in backup_dir

  vars:
    tomcat_user: tomcat
    tomcat_group: tomcat
    tomcat_install_dir: /opt/tomcat
    tomcat_new_version: 10.0.27
    tomcat_temp_dir: /opt/tomcat_10
    backup_dir: "/opt/tomcat_9_backup_{{ ansible_date_time.date }}"
    tomcat_download_url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_new_version }}/bin/apache-tomcat-{{ tomcat_new_version }}.tar.gz"
    # define this if you still want to use pause
    sleep_interval: 10

  tasks:
    - name: Get Tomcat version before upgrade
      ansible.builtin.shell: "{{ tomcat_install_dir }}/bin/version.sh"
      register: tomcat_version_before

    - name: Display Tomcat version before upgrade
      ansible.builtin.debug:
        msg: "{{ tomcat_version_before.stdout }}"

    - name: Stop Tomcat
    # run as tomcat user rather than calling sudo inside shell
      ansible.builtin.shell: "{{ tomcat_install_dir }}/bin/shutdown.sh || true"
      become_user: "{{ tomcat_user }}"

    - name: Backup existing Tomcat
      ansible.builtin.command: mv "{{ tomcat_install_dir }}" "{{ backup_dir }}"
      args:
        creates: "{{ backup_dir }}"

    - name: Download Tomcat 10
      ansible.builtin.get_url:
        url: "{{ tomcat_download_url }}"
        dest: "/tmp/apache-tomcat-{{ tomcat_new_version }}.tar.gz"
        mode: '0644'

    - name: Create temporary Tomcat 10 directory
      ansible.builtin.file:
        path: "{{ tomcat_temp_dir }}"
        state: directory
        mode: '0755'

    - name: Extract Tomcat 10
      ansible.builtin.unarchive:
        src: "/tmp/apache-tomcat-{{ tomcat_new_version }}.tar.gz"
        dest: "{{ tomcat_temp_dir }}"
        remote_src: yes
        extra_opts: [--strip-components=1]

    - name: Rename Tomcat 10 to /opt/tomcat
      ansible.builtin.command: mv "{{ tomcat_temp_dir }}" "{{ tomcat_install_dir }}"

    - name: Set Tomcat ownership
      ansible.builtin.file:
        path: "{{ tomcat_install_dir }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        recurse: yes
        state: directory

    - name: Start Tomcat
      ansible.builtin.shell: "{{ tomcat_install_dir }}/bin/startup.sh"
      become_user: "{{ tomcat_user }}"


    - name: Wait for Tomcat to start (simple pause)
      ansible.builtin.pause:
        seconds: "{{ sleep_interval }}"


    - name: Get Tomcat version after upgrade
      ansible.builtin.shell: "{{ tomcat_install_dir }}/bin/version.sh"
      register: tomcat_version_after

    - name: Display Tomcat version after upgrade
      ansible.builtin.debug:
        msg: "{{ tomcat_version_after.stdout }}"

---
- name: Deploy Application to Tomcat
  hosts: server
  become: yes

  vars:
    tomcat_webapps: /opt/tomcat/apache-tomcat-9.0.54/webapps
    war_file: /tmp/__calendar.war

  tasks:

    - name: Stop Tomcat
      shell: /opt/tomcat/apache-tomcat-9.0.54/bin/shutdown.sh
      ignore_errors: yes

    - name: Remove old application
      file:
        path: "{{ tomcat_webapps }}/myapp"
        state: absent

    - name: Copy WAR file
      copy:
        src: "{{ war_file }}"
        dest: "{{ tomcat_webapps }}/"
        mode: '0644'
        remote_src: True

    - name: Start Tomcat
      shell: /opt/tomcat/apache-tomcat-9.0.54/bin/startup.sh
